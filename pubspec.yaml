name: aura_stream
description: "Aura Stream - Premium Next-Gen OTT Streaming Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Routing
  go_router: ^14.8.0
  # State Management
  provider: ^6.1.2
  # Glassmorphism & UI effects
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Video Playback (Member 1)
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_windows_video: ^1.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - design_references/
    - assets/
    - assets/data/
    - assets/data/mock_data.json
    - assets/mock_data.json
